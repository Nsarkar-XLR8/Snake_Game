<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #222;
    }
    canvas {
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let box = 20;
    let snake = [{x: 9*box, y: 10*box}];
    let food = {x: Math.floor(Math.random()*29+1)*box, y: Math.floor(Math.random()*29+1)*box};
    let dx = box, dy = 0;

    document.addEventListener("keydown", e => {
      if(e.key === "ArrowUp" && dy === 0) {dx=0; dy=-box;}
      if(e.key === "ArrowDown" && dy === 0) {dx=0; dy=box;}
      if(e.key === "ArrowLeft" && dx === 0) {dx=-box; dy=0;}
      if(e.key === "ArrowRight" && dx === 0) {dx=box; dy=0;}
    });

    function draw() {
      ctx.fillStyle = "green";
      ctx.fillRect(0,0,600,600);

      for(let s of snake) {
        ctx.fillStyle = "black";
        ctx.fillRect(s.x, s.y, box, box);
      }

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      let head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if(head.x === food.x && head.y === food.y) {
        food = {x: Math.floor(Math.random()*29+1)*box, y: Math.floor(Math.random()*29+1)*box};
      } else {
        snake.pop();
      }

      if(head.x < 0 || head.y < 0 || head.x >= 600 || head.y >= 600 || snake.some(s => s.x===head.x && s.y===head.y)) {
        clearInterval(game);
        alert("Game Over");
      }

      snake.unshift(head);
    }

    let game = setInterval(draw, 100);
  </script>
</body>
</html>

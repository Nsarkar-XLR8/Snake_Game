<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Disk -->
  <rect width="64" height="64" rx="16" fill="#0a0e17"/>
  
  <!-- Snake S-Curve Path -->
  <path d="M 16 18 C 16 10, 32 10, 32 18 C 32 26, 48 26, 48 34 C 48 44, 32 44, 32 50 C 32 54, 20 54, 20 48" 
        fill="none" 
        stroke="url(#snakeGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Snake Eyes -->
  <circle cx="14" cy="16" r="2.5" fill="#ff007f"/>
  <circle cx="20" cy="14" r="2.5" fill="#ff007f"/>
</svg>
